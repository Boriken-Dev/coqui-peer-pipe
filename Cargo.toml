[package]
name = "coqui-peer-pipe"
version = "0.0.0-alpha.0"
description = "Windows named pipes and Unix domain sockets as a coqui-peer transport, with the operating system's access control on by default"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-peer-pipe"
homepage = "https://boriken-dev.github.io/coqui-peer-pipe/"
keywords = ["named-pipe", "unix-socket", "peer", "ipc", "transport"]
categories = ["network-programming", "os"]
exclude = [".*", "*.local.*", "/tools/"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Async listener, stream and message transport over tokio.
tokio = ["dep:tokio", "coqui-peer/tokio"]
# A coqui-web-channel `Channel` over a stream, so coqui-agentic-peer links run on it.
channel = ["dep:coqui-web-channel"]

[dependencies]
# ReadTimeout, WriteTimeout, MessageTransport and Weakening, which make this a transport of the
# family. The family has no releases for now: its crates depend on each other by git revision.
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "1f00bfe6319f64e7ec038a7003746f4f031d538c" }
# A setting weakened at bind or connect is logged; the binary chooses the subscriber.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Async streams, behind `tokio`.
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time"], optional = true }
# The Channel trait, behind `channel`. No features: this crate brings its own driver. The revision
# coqui-agentic-peer pins, since a second revision would be a second trait.
coqui-web-channel = { git = "https://github.com/Boriken-Dev/coqui-web-channel", rev = "0b5b05c9af3417f6b13edc0fc7d9c86c02a63eca", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
# Named pipes. Microsoft's bindings, which tokio already uses. `interprocess` was the candidate above
# them and does not fit: on Windows its stream refuses read and write timeouts, and its client does
# not lower the impersonation level a server gets.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# Connecting without blocking and a chosen backlog, which std's UnixListener and UnixStream do not offer.
socket2 = { version = "0.6", default-features = false, features = ["all"] }
# The peer's credentials, the effective user and waiting on a listener, which neither std nor socket2 has.
libc = { version = "0.2", default-features = false }

[dev-dependencies]
# The two methods the handshake tests drive, and a link on a Channel.
coqui-peer-noise = { git = "https://github.com/Boriken-Dev/coqui-peer-noise", rev = "8777403807e3ad6eb6fddc98d9b5b6753bb0e424" }
coqui-peer-tls = { git = "https://github.com/Boriken-Dev/coqui-peer-tls", rev = "9a61a1a9a9ef9ac37e7198c0d911901775760725", features = ["generate", "tokio"] }
coqui-agentic-peer = { git = "https://github.com/Boriken-Dev/coqui-agentic-peer", rev = "f6da790585e51345fa58f5e989cedd6500a0b962" }
# Arbitrary frames and chunkings.
proptest = { version = "1", default-features = false, features = ["std"] }
# Temporary socket directories.
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "rt-multi-thread", "io-util", "time"] }

[target.'cfg(windows)'.dev-dependencies]
# A restricted token, and a squatter that creates a pipe without this crate.
windows-sys = { version = "0.61", features = ["Win32_System_SystemServices"] }

# coqui-peer-tls names the released coqui-peer, and one PeerId type across the graph needs one source.
[patch.crates-io]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "1f00bfe6319f64e7ec038a7003746f4f031d538c" }

[[test]]
name = "asynch"
required-features = ["tokio"]

[[test]]
name = "channel"
required-features = ["channel"]
