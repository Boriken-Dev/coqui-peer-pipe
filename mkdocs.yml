site_name: coqui-transport-pipe
site_description: Windows named pipes and Unix domain sockets as a coqui-peer transport.
site_url: https://boriken-dev.github.io/coqui-transport-pipe/
repo_url: https://github.com/Boriken-Dev/coqui-transport-pipe
repo_name: Boriken-Dev/coqui-transport-pipe
edit_uri: edit/main/docs/

# Constrained to docs/ so a strict build does not scan the repository's own markdown.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Rust API: https://boriken-dev.github.io/coqui-transport-pipe/rust/index.html

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
